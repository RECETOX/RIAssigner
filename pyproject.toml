[tool.poetry]
name = "RIAssigner"
version = "0.6.0"
description = "Python library for retention index calculation."
authors = ["Helge Hecht <helge.hecht@recetox.muni.cz>", "Maksym Skoryk <maksym.skoryk@recetox.muni.cz>"]

license = "MIT License"
readme = "README.md"
repository = "https://github.com/RECETOX/RIAssigner"
keywords=[
    "gas chromatography",
    "mass spectrometry",
    "retention index"
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Programming Language :: Python :: 3.11",
]

packages = [
    { include = "RIAssigner" },
]

[tool.poetry.scripts]
riassigner = "RIAssigner.__main__:main"

[tool.poetry.dependencies]
python = "^3.11, <3.14"
matchms = "^0.30.1"
numpy = "*"
pandas = "*"
pint = "^0.25.2"
scipy = "*"
fastparquet = "^2025.12.0"
click = ">=8.0"

[tool.poetry.group.dev.dependencies]
pytest = "*"
pytest-cov = "*"
pre-commit = "^4.2.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry_bumpversion.file."RIAssigner/__version__.py"]

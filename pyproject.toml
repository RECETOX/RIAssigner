[project]
name = "RIAssigner"
version = "0.6.1"
description = "Python library for retention index calculation."
authors = [
    { name = "Helge Hecht", email = "helge.hecht@recetox.muni.cz" },
    { name = "Maksym Skoryk", email = "maksym.skoryk@recetox.muni.cz" },
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.11,<3.14"
keywords = [
    "gas chromatography",
    "mass spectrometry",
    "retention index",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Programming Language :: Python :: 3.11",
]
dependencies = [
    "matchms>=0.30.1,<0.31.0",
    "numpy",
    "pandas",
    "pint>=0.25.2,<0.26.0",
    "scipy",
    "fastparquet>=2025.12.0,<2026.0.0",
    "click>=8.0",
    "urllib3>=2.6.3,<3.0.0",
]

[project.urls]
Repository = "https://github.com/RECETOX/RIAssigner"

[project.scripts]
riassigner = "RIAssigner.__main__:main"

[dependency-groups]
docs = [
    "sphinx",
    "sphinx-rtd-theme",
    "sphinx-autoapi",
    "myst-parser",
]
dev = [
    "pytest",
    "pytest-cov",
    "pre-commit>=4.2.0,<5.0.0",
    "cffconvert>=2.0.0,<3.0.0",
    "ruff>=0.15.5,<0.16.0",
    "flake8",
]

[build-system]
requires = ["setuptools>=78.1.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["RIAssigner*"]

[tool.ruff]
line-length = 200
